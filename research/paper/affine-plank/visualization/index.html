<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plank Coverings — Equilateral Triangle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Fira+Code:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg-page:#090c14; --bg0:#101420; --bg1:#06080e;
  --ink:#c0b8a8; --title:#a09078; --muted:#5a5040; --sect:#706050;
  --val:#8a8070; --legend:#4a4238; --tag:#7a7060;
  --btn-bg:rgba(160,140,120,.08); --btn-bd:rgba(160,140,120,.15);
  --btn-bg-h:rgba(160,140,120,.15);
  --btn-bg-a:rgba(120,180,140,.12); --btn-bd-a:rgba(120,180,140,.3); --btn-fg-a:#8ac0a0;
  --ok:#7ab890; --bad:#c87868; --warn:#c8a868;
  --grid:#a09080; --grid-o:.035;
  --tri:#a09070; --tri-halo:rgba(200,180,140,.06); --tri-fill:rgba(180,160,120,.015);
  --vdot:#b0a090; --vlabel:#807060;
  --r0-fill:rgba(192,128,96,.17); --r0-line:rgba(192,128,96,.35); --r0-text:rgba(192,128,96,.8);
  --r1-fill:rgba(106,168,136,.17); --r1-line:rgba(106,168,136,.35); --r1-text:rgba(106,168,136,.8);
  --r2-fill:rgba(120,152,192,.17); --r2-line:rgba(120,152,192,.35); --r2-text:rgba(120,152,192,.8);
  --gap-fill:rgba(200,100,100,.3); --gap-stroke:rgba(255,150,150,.15);
  --tseg:rgba(200,120,104,.7); --tseg-label:#c87868;
  --gold:#e0c890; --gold-dim:#c0a870;
  --frame-bd:rgba(180,160,120,.06);
}
:root[data-theme=light]{
  --bg-page:#efe8d8; --bg0:#faf5e9; --bg1:#e7dec9;
  --ink:#4a4238; --title:#7a5f35; --muted:#8a7c66; --sect:#7a6a50;
  --val:#6a5f50; --legend:#8a7c66; --tag:#9a8a72;
  --btn-bg:rgba(110,90,60,.07); --btn-bd:rgba(110,90,60,.2);
  --btn-bg-h:rgba(110,90,60,.14);
  --btn-bg-a:rgba(60,130,90,.12); --btn-bd-a:rgba(60,130,90,.4); --btn-fg-a:#2f6d4c;
  --ok:#33754f; --bad:#a84a36; --warn:#8a6a10;
  --grid:#6a5a40; --grid-o:.06;
  --tri:#6a5a40; --tri-halo:rgba(90,70,40,.07); --tri-fill:rgba(120,100,60,.03);
  --vdot:#5a4c3a; --vlabel:#6a5a48;
  --r0-fill:rgba(168,84,44,.2); --r0-line:rgba(168,84,44,.4); --r0-text:rgba(150,70,35,.95);
  --r1-fill:rgba(44,122,82,.2); --r1-line:rgba(44,122,82,.4); --r1-text:rgba(30,105,68,.95);
  --r2-fill:rgba(44,92,156,.2); --r2-line:rgba(44,92,156,.4); --r2-text:rgba(35,80,140,.95);
  --gap-fill:rgba(190,70,55,.35); --gap-stroke:rgba(150,45,35,.3);
  --tseg:rgba(170,70,50,.8); --tseg-label:#a05540;
  --gold:#a87b18; --gold-dim:#8a6a20;
  --frame-bd:rgba(110,90,60,.15);
}
body{
  background:var(--bg-page);color:var(--ink);
  font-family:'Fira Code',monospace;
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;padding:.8rem;
}
h1{
  font-family:'Cormorant Garamond',serif;font-weight:300;font-size:1.6rem;
  letter-spacing:.18em;text-transform:uppercase;color:var(--title);
  margin-top:.4rem;margin-bottom:.05rem;
}
.sub{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-weight:300;font-size:.9rem;color:var(--muted);
  letter-spacing:.06em;margin-bottom:.5rem;
}
.wrap{display:flex;gap:1.2rem;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.diagram{width:640px}
#canvas-wrap{
  position:relative;width:640px;height:580px;
  border:1px solid var(--frame-bd);border-radius:6px;overflow:hidden;
}
svg{width:100%;height:100%;display:block}
.bgstop0{stop-color:var(--bg0)}
.bgstop1{stop-color:var(--bg1)}
.grid{opacity:var(--grid-o)}
.controls{width:260px;display:flex;flex-direction:column;gap:.5rem;font-size:.72rem}
.family-btn{
  background:var(--btn-bg);border:1px solid var(--btn-bd);
  color:var(--title);padding:.4rem .6rem;border-radius:4px;cursor:pointer;
  font-family:'Fira Code',monospace;font-size:.68rem;
  transition:background .3s;text-align:left;line-height:1.35;
}
.family-btn:hover{background:var(--btn-bg-h)}
.family-btn.active{background:var(--btn-bg-a);border-color:var(--btn-bd-a);color:var(--btn-fg-a)}
.slider-row{display:flex;align-items:center;gap:.4rem}
.slider-row label{width:2.4rem;text-align:right;color:var(--muted);font-size:.62rem}
.slider-row input[type=range]{flex:1;accent-color:var(--ok);height:14px}
.slider-row .val{width:3rem;text-align:left;font-size:.62rem;color:var(--val)}
.section-label{
  font-family:'Cormorant Garamond',serif;font-weight:600;
  font-size:.75rem;color:var(--sect);letter-spacing:.08em;
  text-transform:uppercase;margin-top:.3rem;
}
.hud{
  display:flex;gap:1.5rem;align-items:baseline;justify-content:center;font-size:.78rem;color:var(--muted);
  margin-top:.4rem;
}
.sum-rw{font-size:1rem;font-weight:400;letter-spacing:.04em}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.info{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:.78rem;color:var(--muted);max-width:260px;line-height:1.35;
  margin-top:.3rem;
}
.t-sum{font-size:.85rem;font-weight:400;letter-spacing:.04em}
#themeBtn{
  position:fixed;top:.7rem;right:.9rem;
  background:var(--btn-bg);border:1px solid var(--btn-bd);color:var(--title);
  width:2rem;height:2rem;border-radius:50%;cursor:pointer;font-size:.9rem;
}
#themeBtn:hover{background:var(--btn-bg-h)}
#playBtn{
  position:absolute;top:.6rem;left:.6rem;z-index:2;
  background:var(--btn-bg);border:1px solid var(--btn-bd);color:var(--title);
  width:2rem;height:2rem;border-radius:50%;cursor:pointer;font-size:.62rem;
  display:flex;align-items:center;justify-content:center;line-height:1;
  padding:0 0 .12rem;  /* glyph em-boxes reserve descender space; recenter optically */
}
#playBtn:hover{background:var(--btn-bg-h)}
</style>
<script>
document.documentElement.setAttribute('data-theme',
  localStorage.getItem('tight-theme')||
  (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
</script>
</head>
<body>

<button id="themeBtn" title="Toggle light/dark"></button>
<h1>Plank Coverings</h1>
<div class="sub">Explore an equilateral triangle</div>

<div class="wrap">
<div class="diagram">
<div id="canvas-wrap">
<button id="playBtn" title="Pause / play the drift"></button>
<svg id="viz" viewBox="0 0 640 580" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="58%">
      <stop offset="0%" class="bgstop0"/>
      <stop offset="100%" class="bgstop1"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
</div>

<div class="hud">
  <div class="sum-rw">&Sigma;rw = <span class="ok" id="svEl"></span></div>
  <div class="t-sum">Uncovered edge = <span id="tsumEl"></span></div>
  <div id="coverageEl" style="font-size:.82rem"></div>
</div>

<div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.72rem;color:var(--legend);text-align:center;margin-top:.5rem;line-height:1.4">
  Gold marks contacts. Drag a slider to hold it; click the diagram to pause or resume.
</div>
</div>

<div class="controls">
  <button class="family-btn active" data-family="free">
    <strong>Free exploration</strong>
  </button>
  <div class="section-label">Covering families</div>
  <button class="family-btn" data-family="edgetiling">
    <strong>Edge tiling</strong>
  </button>
  <button class="family-btn" data-family="cuttile">
    <strong>Cut + tile</strong>
  </button>
  <button class="family-btn" data-family="hunter">
    <strong>Hunter</strong>
  </button>

  <details style="margin:.35rem 0">
    <summary style="cursor:pointer;font-size:.62rem;color:var(--sect);letter-spacing:.08em">Old subsumed families</summary>
    <button class="family-btn" data-family="ycovering">
      <strong>Y-covering</strong>
    </button>
    <button class="family-btn" data-family="parallel">
      <strong>Parallel partition</strong>
    </button>
    <button class="family-btn" data-family="epfpfp">
      <strong>EP&sdot;FP&sdot;FP</strong>
    </button>
    <button class="family-btn" data-family="epepfp">
      <strong>EP&sdot;EP&sdot;FP</strong>
    </button>
    <button class="family-btn" data-family="band">
      <strong>Continuous band</strong>
    </button>
    <button class="family-btn" data-family="cornertri">
      <strong>Corner triangle</strong>
    </button>
  </details>

  <div class="section-label" style="margin-top:.4rem">Parameters</div>
  <div class="slider-row">
    <label>rw&#x2080;</label>
    <input type="range" step="any" id="rw0" min="0" max="100" value="33">
    <span class="val" id="rw0v"></span>
  </div>
  <div class="slider-row">
    <label>rw&#x2081;</label>
    <input type="range" step="any" id="rw1" min="0" max="100" value="33">
    <span class="val" id="rw1v"></span>
  </div>
  <div class="slider-row">
    <label>rw&#x2082;</label>
    <input type="range" step="any" id="rw2" min="0" max="100" value="34" disabled style="opacity:.3">
    <span class="val" id="rw2v"></span>
  </div>
  <div class="slider-row" data-for="free">
    <label>&theta;&#x2080;</label>
    <input type="range" step="any" id="fth0" min="0" max="180" value="23">
    <span class="val" id="fth0v"></span>
  </div>
  <div class="slider-row" data-for="free">
    <label>&theta;&#x2081;</label>
    <input type="range" step="any" id="fth1" min="0" max="180" value="74">
    <span class="val" id="fth1v"></span>
  </div>
  <div class="slider-row" data-for="free">
    <label>&theta;&#x2082;</label>
    <input type="range" step="any" id="fth2" min="0" max="180" value="132">
    <span class="val" id="fth2v"></span>
  </div>
  <div class="slider-row" data-for="free">
    <label>p&#x2080;</label>
    <input type="range" step="any" id="fp0" min="0" max="100" value="50">
    <span class="val" id="fp0v"></span>
  </div>
  <div class="slider-row" data-for="free">
    <label>p&#x2081;</label>
    <input type="range" step="any" id="fp1" min="0" max="100" value="40">
    <span class="val" id="fp1v"></span>
  </div>
  <div class="slider-row" data-for="free">
    <label>p&#x2082;</label>
    <input type="range" step="any" id="fp2" min="0" max="100" value="60">
    <span class="val" id="fp2v"></span>
  </div>
  <div class="slider-row" data-for="parallel cornertri" hidden>
    <label>&alpha;</label>
    <input type="range" step="any" id="alpha" min="0" max="180" value="45">
    <span class="val" id="alphav"></span>
  </div>
  <div class="slider-row" data-for="band" hidden>
    <label>&theta;&#x2081;</label>
    <input type="range" step="any" id="bandTheta1" min="0" max="300" value="150">
    <span class="val" id="bandTheta1v"></span>
  </div>
  <div class="slider-row" data-for="edgetiling">
    <label>&theta;&#x2081;</label>
    <input type="range" step="any" id="etT1" min="-300" max="300" value="-150">
    <span class="val" id="etT1v"></span>
  </div>
  <div class="slider-row" data-for="edgetiling">
    <label>&theta;&#x2082;</label>
    <input type="range" step="any" id="etT2" min="-300" max="300" value="0">
    <span class="val" id="etT2v"></span>
  </div>
  <div class="slider-row" data-for="edgetiling">
    <label>&theta;&#x2083;</label>
    <input type="range" step="any" id="etT3" min="-300" max="300" value="150">
    <span class="val" id="etT3v"></span>
  </div>
  <div class="slider-row" data-for="hunter" hidden>
    <label>a&#x2081;</label>
    <input type="range" step="any" id="hexA1" min="1" max="999" value="500">
    <span class="val" id="hexA1v"></span>
  </div>
  <div class="slider-row" data-for="hunter" hidden>
    <label>a&#x2082;</label>
    <input type="range" step="any" id="hexA2" min="1" max="999" value="500">
    <span class="val" id="hexA2v"></span>
  </div>
  <div class="slider-row" data-for="hunter" hidden style="opacity:.65">
    <label style="color:var(--warn)">&Delta;b&#x2080;</label>
    <input type="range" step="any" id="hexDb" min="-490" max="490" value="0" style="accent-color:var(--warn)">
    <span class="val" id="hexDbv"></span>
  </div>
  <div data-for="hunter" hidden style="font-size:.55rem;color:var(--sect);margin:-.3rem 0 0 2.8rem">
    0 = tight covering
  </div>
  <div class="slider-row" data-for="cuttile" hidden>
    <label>&theta;&#x2081;</label>
    <input type="range" step="any" id="ctT1" min="-300" max="300" value="-100">
    <span class="val" id="ctT1v"></span>
  </div>
  <div class="slider-row" data-for="cuttile" hidden>
    <label>&theta;&#x2082;</label>
    <input type="range" step="any" id="ctT2" min="-300" max="300" value="100">
    <span class="val" id="ctT2v"></span>
  </div>

  <div class="info" id="infoEl"></div>
</div>
</div>

<script>
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const svg=$('viz');
const VW=640,VH=580,S3=Math.sqrt(3);

// Triangle in SVG (y-down): V0=bottom-left, V1=bottom-right, V2=top
const sc=360;
const mx=VW/2, my=340;
const TRI=[
  [mx-sc/2, my+sc*S3/6],   // V0
  [mx+sc/2, my+sc*S3/6],   // V1
  [mx, my-sc*S3/3]          // V2
];
// Math coords: V0=(0,0), V1=(1,0), V2=(0.5, S3/2)
const vMath=[[0,0],[1,0],[0.5,S3/2]];

// Math -> SVG coordinate transform
function m2s(x,y){
  const sx=TRI[0][0]+x*(TRI[1][0]-TRI[0][0])+(2*y/S3)*(TRI[2][0]-(TRI[0][0]+TRI[1][0])/2);
  const sy=TRI[0][1]+(2*y/S3)*(TRI[2][1]-TRI[0][1]);
  return[sx,sy];
}
function mkEl(tag,attrs,parent){
  const e=document.createElementNS(NS,tag);
  for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);
  (parent||svg).appendChild(e);return e;
}
function setText(el,text){
  if(el.textContent!==text)el.textContent=text;
}
function setLine(el,[x1,y1],[x2,y2]){
  el.setAttribute('x1',x1);el.setAttribute('y1',y1);
  el.setAttribute('x2',x2);el.setAttribute('y2',y2);
}

// ── Static scene ──
mkEl('rect',{x:0,y:0,width:VW,height:VH,fill:'url(#bg)'});
const gridG=mkEl('g',{class:'grid'});
for(let gx=30;gx<VW;gx+=35)for(let gy=30;gy<VH;gy+=35)
  mkEl('circle',{cx:gx,cy:gy,r:'.4',fill:'var(--grid)'},gridG);

// Layers
const gRegions=mkEl('g',{});
const gPlankLines=mkEl('g',{});
const gTri=mkEl('g',{});
const gTsegs=mkEl('g',{filter:'url(#softglow)'});
const gYpoint=mkEl('g',{filter:'url(#glow)'});
const gTouch=mkEl('g',{filter:'url(#glow)'});
const gLabels=mkEl('g',{});

// Plank slabs: full strip across the canvas (planks are infinite slabs),
// with a full-strength fill inside the triangle on top
const regionFull=[],regionPaths=[];
for(let i=0;i<3;i++)regionFull.push(mkEl('path',{d:'',fill:`var(--r${i}-fill)`,opacity:'0.45',stroke:'none'},gRegions));
for(let i=0;i<3;i++)regionPaths.push(mkEl('path',{d:'',fill:`var(--r${i}-fill)`,stroke:'none'},gRegions));

// Gap cell highlight
const gapPath=mkEl('path',{d:'',fill:'var(--gap-fill)',stroke:'var(--gap-stroke)','stroke-width':'1'},gRegions);

// Plank boundary lines (lo, hi per plank)
const plankLines=[];
for(let i=0;i<3;i++)for(let j=0;j<2;j++)
  plankLines.push(mkEl('line',{x1:0,y1:0,x2:0,y2:0,
    stroke:`var(--r${i}-line)`,'stroke-width':'0.9'},gPlankLines));

// Triangle
mkEl('polygon',{points:TRI.map(v=>v.join(',')).join(' '),
  fill:'var(--tri-fill)',stroke:'var(--tri)','stroke-width':'1.5','stroke-linejoin':'round'},gTri);
mkEl('polygon',{points:TRI.map(v=>v.join(',')).join(' '),
  fill:'none',stroke:'var(--tri-halo)','stroke-width':'5','stroke-linejoin':'round'},gTri);

// Vertex labels
const VL=['V₀','V₁','V₂'];
const VO=[[0,16],[0,16],[0,-10]];
for(let i=0;i<3;i++){
  mkEl('circle',{cx:TRI[i][0],cy:TRI[i][1],r:2.5,fill:'var(--vdot)'},gTri);
  mkEl('text',{x:TRI[i][0]+VO[i][0],y:TRI[i][1]+VO[i][1],
    fill:'var(--vlabel)','font-size':'11','text-anchor':'middle',
    'font-family':'Cormorant Garamond,serif'},gLabels).textContent=VL[i];
}

// t-segments: uncovered edge runs (one path per edge holds every run)
const tSegPaths=[],tSegLabels=[];
for(let i=0;i<3;i++){
  tSegPaths.push(mkEl('path',{d:'',fill:'none',
    stroke:'var(--tseg)','stroke-width':'3','stroke-linecap':'round'},gTsegs));
  tSegLabels.push(mkEl('text',{x:0,y:0,fill:'var(--tseg-label)','font-size':'12',
    'text-anchor':'middle','font-family':'Cormorant Garamond,serif',
    'font-style':'italic'},gLabels));
  tSegLabels[i].textContent=['t₁','t₂','t₃'][i];
}

// Contact set: glowing dots for point contacts, strokes for anchored
// segment contacts (gap cells degenerated under L1 pinning)
const touchDots=[];
for(let i=0;i<16;i++)
  touchDots.push(mkEl('circle',{cx:0,cy:0,r:3,fill:'var(--gold)',opacity:'0'},gTouch));
const touchSegs=[];
for(let i=0;i<8;i++)
  touchSegs.push(mkEl('line',{x1:0,y1:0,x2:0,y2:0,stroke:'var(--gold)',
    'stroke-width':'2','stroke-linecap':'round',opacity:'0'},gTouch));

// Y-point marker
const ypointCircle=mkEl('circle',{cx:0,cy:0,r:4,fill:'var(--gold)',opacity:'0.8'},gYpoint);
const ypointLabel=mkEl('text',{x:0,y:0,fill:'var(--gold-dim)','font-size':'10',
  'text-anchor':'start','font-family':'Cormorant Garamond,serif',
  'font-style':'italic'},gLabels);

// Plank direction labels
const dirLabels=[];
for(let i=0;i<3;i++)
  dirLabels.push(mkEl('text',{x:0,y:0,fill:`var(--r${i}-text)`,
    'font-size':'10','text-anchor':'middle',
    'font-family':'Fira Code,monospace'},gLabels));

// ══════════════════════════════════════════════════════════════
//  Polygon clipping (Sutherland-Hodgman)
// ══════════════════════════════════════════════════════════════

function triHalfPlanes(verts){
  const cx=(verts[0][0]+verts[1][0]+verts[2][0])/3;
  const cy=(verts[0][1]+verts[1][1]+verts[2][1])/3;
  const hp=[];
  for(let i=0;i<3;i++){
    const[ax,ay]=verts[i],[bx,by]=verts[(i+1)%3];
    let nx=-(by-ay),ny=bx-ax,c=nx*ax+ny*ay;
    if(nx*cx+ny*cy>c){nx=-nx;ny=-ny;c=-c;}
    hp.push({nx,ny,c});
  }
  return hp;
}
const triHP=triHalfPlanes(TRI);        // SVG coords (slab fills)
const triMathHP=triHalfPlanes(vMath);  // math coords (cells)

function clipHP(poly,nx,ny,c){
  const n=poly.length;if(n<2)return[];
  const out=[];
  for(let i=0;i<n;i++){
    const[cx_,cy_]=poly[i],[nx_,ny_]=poly[(i+1)%n];
    const dc=nx*cx_+ny*cy_-c, dn=nx*nx_+ny*ny_-c;
    if(dc<=0){out.push(poly[i]);if(dn>0){const t=dc/(dc-dn);out.push([cx_+t*(nx_-cx_),cy_+t*(ny_-cy_)]);}}
    else if(dn<=0){const t=dc/(dc-dn);out.push([cx_+t*(nx_-cx_),cy_+t*(ny_-cy_)]);}
  }return out;
}
function clipToTri(poly,hp){
  let p=poly;
  for(const{nx,ny,c}of hp){p=clipHP(p,nx,ny,c);if(p.length<3)return[];}
  return p;
}
function polyArea(p){
  if(p.length<3)return 0;
  let a=0;
  for(let i=0;i<p.length;i++){const j=(i+1)%p.length;a+=p[i][0]*p[j][1]-p[j][0]*p[i][1];}
  return Math.abs(a)/2;
}
function toD(poly){
  if(!poly||poly.length<3)return'';
  return'M'+poly.map(v=>v[0].toFixed(1)+','+v[1].toFixed(1)).join('L')+'Z';
}
// Line in SVG from math constraint <(cos,sin),x> = val
function mathLine(ct,st,val,ext=3){
  if(Math.abs(st)>0.01)
    return[m2s(-ext,(val+ct*ext)/st),m2s(1+ext,(val-ct*(1+ext))/st)];
  return[m2s(val/ct,-ext),m2s(val/ct,S3/2+ext)];
}
// Open sign cell sigma (0 = below plank i's lo, 1 = above its hi),
// eps-thickened, clipped to the triangle; [] when empty.
function cellPoly(sigma,ct,st,lo,hi,eps){
  let poly=[[-0.5,-0.5],[1.5,-0.5],[1.5,1.2],[-0.5,1.2]];
  for(let i=0;i<3&&poly.length>=3;i++){
    if(sigma[i]===0)poly=clipHP(poly,ct[i],st[i],lo[i]+eps);
    else poly=clipHP(poly,-ct[i],-st[i],-(hi[i]-eps));
  }
  return poly.length>=3?clipToTri(poly,triMathHP):[];
}

// ══════════════════════════════════════════════════════════════
//  State & covering families
// ══════════════════════════════════════════════════════════════

let family='free',rw0=1/3,rw1=1/3,alpha=Math.PI/4;

const rw0Sl=$('rw0'),rw1Sl=$('rw1'),alphaSl=$('alpha'),bandSl=$('bandTheta1');
const etSl=[$('etT1'),$('etT2'),$('etT3')];
const ctT1Sl=$('ctT1'),ctT2Sl=$('ctT2');
const hexA1Sl=$('hexA1'),hexA2Sl=$('hexA2'),hexDbSl=$('hexDb');
const fthSl=[$('fth0'),$('fth1'),$('fth2')],fpSl=[$('fp0'),$('fp1'),$('fp2')];
const rwOut=[$('rw0v'),$('rw1v'),$('rw2v')];
const rw2Sl=$('rw2');
const svEl=$('svEl'),infoEl=$('infoEl'),tsumEl=$('tsumEl'),covEl=$('coverageEl');

// ── Hunter equality family (Hunter 1993; hexagonal cell, K=0 Ceva surface) ──
// Std frame: u0=(1,b0), u1=(a1,1), u2=(a2,a2-1); widths all 1.
function hexB0K(a1,a2){return a1*(1-a2)/(a1*(1-a2)+(1-a1)*a2);}
function hexStdConfig(a1,a2,b0){
  const P=a1+a2-a1*a2, Q=1-a2*(1-b0);
  const M=1+a2*b0*(1-a1), E=1+a1*(1-a2)*(1-b0);
  const lo=[b0*P/M, a1*Q/E, -a1*(1-a2)*Q/E];
  const hi=[Q/E, P/M, a2*b0*P/M];
  const U=[[1,b0],[a1,1],[a2,a2-1]];
  const K=a1*(1-a2)*(1-b0)-(1-a1)*a2*b0;
  // touch points, std coords: A,B bottom; L1,L2 left; C,D hyp
  const c=(1-a2)*(1-a1*b0)/E, d=Q/M;
  const pts=[[lo[0],0],[hi[0],0],[0,lo[1]],[0,hi[1]],[c,1-c],[d,1-d]];
  return{U,lo,hi,K,M,E,pts};
}
// Plank transform std -> equilateral: y = T x, T = [[1,1/2],[0,S3/2]];
// {lo <= <x,u>} = {lo <= <y, T^-T u>}, T^-T u = (ux, (-ux+2uy)/S3).
function hexToEquil(U,lo,hi){
  const out=[];
  for(let i=0;i<3;i++){
    const raw=[U[i][0], (-U[i][0]+2*U[i][1])/S3];
    const n=Math.hypot(raw[0],raw[1]);
    let u=[raw[0]/n,raw[1]/n], l=lo[i]/n, h=hi[i]/n;
    if(u[1]<0||(Math.abs(u[1])<1e-15&&u[0]<0)){u=[-u[0],-u[1]];const t=l;l=-h;h=-t;}
    out.push({theta:Math.atan2(u[1],u[0]),lo:l,hi:h});
  }
  return out;
}

// One entry per family: rw-slider mode ('free' | 'linked' rw1=rw0 |
// 'fixed' 1/3 each | 'rw0' rw0 only), panel preset [rw0,rw1(,alpha)],
// and the configuration map. config may override rw and add hexPts.
const FAMILIES={
  free:{rwMode:'indep',preset:[33,33],config(){
    const theta=fthSl.map(sl=>sl.value*Math.PI/180);
    const rw=[rw0Sl,rw1Sl,rw2Sl].map(sl=>sl.value/100);
    const lo=[],hi=[];
    for(let i=0;i<3;i++){
      const c=Math.cos(theta[i]),st_=Math.sin(theta[i]);
      const p=vMath.map(([x,y])=>c*x+st_*y);
      const pmin=Math.min(...p),W=Math.max(...p)-pmin;
      const w=rw[i]*W;
      // common-sense necessity: every corner must be covered (an
      // uncovered vertex can never be part of a covering), so slab i
      // is required to contain vertex i's projection; at the ends of
      // its travel (p = 0 or 1) the boundary anchors on the corner
      const vP=c*vMath[i][0]+st_*vMath[i][1];
      const loMin=Math.max(pmin, vP-w);
      const loMax=Math.min(pmin+W-w, vP);
      const l=loMin+(fpSl[i].value/100)*(loMax-loMin);
      lo.push(l);hi.push(l+w);
    }
    return{theta,lo,hi,rw,
      info:'Each plank covers its vertex; widths vary independently.'};
  }},
  edgetiling:{rwMode:'free',preset:[33,33],config(r0,r1){
    const t=etSl.map(sl=>sl.value/10*Math.PI/180);
    const c1=Math.min(r0,1), c2=Math.min(r0+r1,1);
    const cs=[0,c1,c2,1];
    return{theta:t,
      lo:[0,1,2].map(i=>cs[i]*Math.cos(t[i])),
      hi:[0,1,2].map(i=>cs[i+1]*Math.cos(t[i])),
      info:'The planks tile one edge; their angles stay in order.'};
  }},
  cuttile:{rwMode:'free',preset:[25,25],config(r0,r1){
    const r=r0, t=r0<1?Math.min(1,r1/(1-r0)):0;  // seam from rw1 = (1-r)t
    const t1=ctT1Sl.value/10*Math.PI/180;
    const t2=ctT2Sl.value/10*Math.PI/180;
    const s=1-r, y0=r*S3/2, o=[r/2,y0];
    const b1=Math.cos(t1)*o[0]+Math.sin(t1)*o[1];
    const b2=Math.cos(t2)*o[0]+Math.sin(t2)*o[1];
    return{theta:[Math.PI/2,t1,t2],
      lo:[0, b1, b2+t*s*Math.cos(t2)],
      hi:[y0, b1+t*s*Math.cos(t1), b2+s*Math.cos(t2)],
      info:'One plank covers the base; two cover the remaining triangle.'};
  }},
  hunter:{rwMode:'fixed',preset:[33,33],config(){
    const a1=hexA1Sl.value/1000, a2=hexA2Sl.value/1000, db0=hexDbSl.value/1000;
    const b0=Math.min(.9995,Math.max(.0005,hexB0K(a1,a2)+db0));
    const cfg=hexStdConfig(a1,a2,b0);
    const eq=hexToEquil(cfg.U,cfg.lo,cfg.hi);
    const theta=eq.map(p=>p.theta), lo=eq.map(p=>p.lo), hi=eq.map(p=>p.hi);
    const rw=theta.map((th,i)=>{
      const c=Math.cos(th),s=Math.sin(th);
      const p=vMath.map(([x,y])=>c*x+s*y);
      return(hi[i]-lo[i])/(Math.max(...p)-Math.min(...p));
    });
    return{theta,lo,hi,rw,
      hexPts:cfg.pts.map(([x,y])=>[x+y/2, y*S3/2]),  // std -> equilateral
      info:'Six contact points. Set Δb₀ = 0 for a tight covering.'};
  }},
  ycovering:{rwMode:'free',preset:[33,33],config(r0,r1,r2){
    const w=S3/2;
    return{theta:[Math.PI/6,Math.PI/2,5*Math.PI/6],
      lo:[(1-r0)*w, 0, -r2*w], hi:[w, r1*w, 0],
      info:'Three planks meet at the Y-point.'};
  }},
  parallel:{rwMode:'free',preset:[33,33],config(r0,r1){
    const vp=[0,Math.cos(alpha),Math.cos(alpha)/2+Math.sin(alpha)*S3/2];
    const pmin=Math.min(...vp),pmax=Math.max(...vp),w=pmax-pmin;
    return{theta:[alpha,alpha,alpha],
      lo:[pmin, pmin+r0*w, pmin+(r0+r1)*w],
      hi:[pmin+r0*w, pmin+(r0+r1)*w, pmax],
      info:'Three parallel planks partition the triangle.'};
  }},
  epfpfp:{rwMode:'linked',preset:[25,25],config(r0){
    const r=r0;
    return{theta:[0,Math.PI/6,Math.PI/2],
      lo:[0.5-r,(1-r)*S3/2, 0], hi:[0.5, S3/2, (1-2*r)*S3/2],
      info:'Directions 0°, 30°, 90°; the first two widths are equal.'};
  }},
  epepfp:{rwMode:'linked',preset:[25,25],config(r0){
    const r=r0;
    return{theta:[0,0,Math.PI/2],
      lo:[0.5-r, 0.5, 0], hi:[0.5, 0.5+r, (1-2*r)*S3/2],
      info:'Two parallel planks meet at the midpoint; a third covers the base.'};
  }},
  band:{rwMode:'fixed',preset:[33,33],config(){
    const t1d=bandSl.value/10, t1=t1d*Math.PI/180;
    const c1=Math.cos(t1),s1=Math.sin(t1);
    const W0=1, W2=S3/2;
    const vp1=[0, c1, c1/2+s1*S3/2];
    const W1=Math.max(...vp1)-Math.min(...vp1);
    const cp1=c1/2+s1*S3/6;
    return{theta:[0,t1,Math.PI/2],
      lo:[1/6, cp1, 0], hi:[1/6+W0/3, cp1+W1/3, W2/3],
      info:'One direction varies from 0° to 30°; each width stays at ⅓.'};
  }},
  cornertri:{rwMode:'free',preset:[30,25,40],config(r0,r1){
    const s1=r0, s2=r1, sTop=Math.max(0,1-s1-s2);
    const W2=S3/2;
    const cv=[[0.5-sTop/2, (1-sTop)*S3/2],[0.5+sTop/2, (1-sTop)*S3/2],[0.5, S3/2]];
    const cc=Math.cos(alpha), ss=Math.sin(alpha);
    const projs=cv.map(([x,y])=>cc*x+ss*y);
    return{theta:[Math.PI/2, Math.PI/2, alpha],
      lo:[0, s1*W2, Math.min(...projs)],
      hi:[s1*W2, (s1+s2)*W2, Math.max(...projs)],
      info:'Two planks cover the base. Rotate the third over the remaining corner.'};
  }},
};

function getConfig(){
  const r0=rw0,r1=rw1,r2=Math.max(0,1-r0-r1);
  return{rw:[r0,r1,r2],...FAMILIES[family].config(r0,r1,r2)};
}

// ══════════════════════════════════════════════════════════════
//  Update
// ══════════════════════════════════════════════════════════════

function update(){
  const{theta,lo,hi,rw,info,hexPts}=getConfig();
  const ct=theta.map(Math.cos),st=theta.map(Math.sin);

  // HUD
  const sum=rw[0]+rw[1]+rw[2];
  for(let i=0;i<3;i++)setText(rwOut[i],rw[i].toFixed(2));
  // grayed sliders double as gauges of the determined widths
  if(rw0Sl.disabled)rw0Sl.value=rw[0]*100;
  if(rw1Sl.disabled)rw1Sl.value=rw[1]*100;
  if(rw2Sl.disabled)rw2Sl.value=rw[2]*100;
  setText(svEl,sum.toFixed(2));
  svEl.className=sum>=.999?'ok':'bad';
  setText(infoEl,info);

  // Plank boundary lines + slab fills
  for(let i=0;i<3;i++){
    const degenerate=Math.abs(hi[i]-lo[i])<1e-10;
    plankLines[i*2].setAttribute('opacity',degenerate?'0':'1');
    plankLines[i*2+1].setAttribute('opacity',degenerate?'0':'1');
    if(degenerate){
      regionPaths[i].setAttribute('d','');
      regionFull[i].setAttribute('d','');
      setText(dirLabels[i],'');
      continue;
    }
    const loL=mathLine(ct[i],st[i],lo[i]);
    const hiL=mathLine(ct[i],st[i],hi[i]);
    setLine(plankLines[i*2],loL[0],loL[1]);
    setLine(plankLines[i*2+1],hiL[0],hiL[1]);
    // full strip everywhere + stronger fill inside the triangle
    const strip=[loL[0],loL[1],hiL[1],hiL[0]];
    regionFull[i].setAttribute('d',toD(strip));
    regionPaths[i].setAttribute('d',toD(clipToTri(strip,triHP)));
    // label on the slab's center line (laterally centered), pushed a
    // fixed distance from the triangle's center along the slab
    const mVal=(lo[i]+hi[i])/2, cx0=0.5, cy0=S3/6;
    const off=mVal-(ct[i]*cx0+st[i]*cy0);
    let tx=-st[i],ty=ct[i];
    if(ty>0||(Math.abs(ty)<1e-12&&tx<0)){tx=-tx;ty=-ty;}
    const mid=m2s(cx0+off*ct[i]+0.55*tx, cy0+off*st[i]+0.55*ty);
    dirLabels[i].setAttribute('x',mid[0]);dirLabels[i].setAttribute('y',mid[1]);
    setText(dirLabels[i],Math.round(theta[i]*180/Math.PI)+'°');
  }

  // Gap cells: open sign cells with positive area are uncovered
  let hasGap=false,gapD='';
  const cellIsGap=new Array(8).fill(false);
  for(let s=0;s<8;s++){
    const sigma=[s&1,(s>>1)&1,(s>>2)&1];
    const inner=cellPoly(sigma,ct,st,lo,hi,0);
    if(inner.length>=3&&polyArea(inner)>1e-8){
      hasGap=true;cellIsGap[s]=true;
      gapD+=toD(inner.map(([x,y])=>m2s(x,y)));
    }
  }
  gapPath.setAttribute('d',gapD);

  // Contact set (L1 pinning): eps-thicken each empty cell; a surviving
  // sliver marks where shrinking a plank boundary would uncover the
  // triangle. eps is small enough that a point contact stays a
  // sub-pixel dot even when a boundary is within slider granularity
  // (0.1deg) of containing an edge; only true segment contacts
  // (eps-independent extent) render as strokes.
  const EPS=1e-6;
  const touch=[],segs=[];
  for(let s=0;s<8;s++){
    if(cellIsGap[s])continue;
    const sigma=[s&1,(s>>1)&1,(s>>2)&1];
    const inner=cellPoly(sigma,ct,st,lo,hi,EPS);
    if(inner.length<3||polyArea(inner)<=1e-14)continue;
    let dmax=0,pa=inner[0],pb=inner[0];
    for(let a=0;a<inner.length;a++)for(let b=a+1;b<inner.length;b++){
      const dd=Math.hypot(inner[a][0]-inner[b][0],inner[a][1]-inner[b][1]);
      if(dd>dmax){dmax=dd;pa=inner[a];pb=inner[b];}
    }
    if(dmax>0.02){
      const mid=[(pa[0]+pb[0])/2,(pa[1]+pb[1])/2];
      if(!segs.some(g=>Math.hypot(g.mid[0]-mid[0],g.mid[1]-mid[1])<0.03))
        segs.push({pa,pb,mid});
    }else{
      let px=0,py=0;
      for(const[x,y]of inner){px+=x;py+=y;}
      px/=inner.length;py/=inner.length;
      if(!touch.some(([qx,qy])=>Math.hypot(qx-px,qy-py)<0.03))touch.push([px,py]);
    }
  }
  // Hunter cell uses its exact closed-form touch points. Segment
  // endpoints get dots too: a point contact stays marked when it
  // becomes the end of an edge contact.
  const cpts=hexPts||[...touch];
  if(!hexPts)for(const g of segs)for(const p of[g.pa,g.pb])
    if(!cpts.some(([qx,qy])=>Math.hypot(qx-p[0],qy-p[1])<0.03))cpts.push(p);
  const tps=cpts.map(([x,y])=>m2s(x,y));
  touchDots.forEach((dot,k)=>{
    if(k<tps.length){
      dot.setAttribute('cx',tps[k][0]);dot.setAttribute('cy',tps[k][1]);
      dot.setAttribute('opacity','0.9');
    }else dot.setAttribute('opacity','0');
  });
  touchSegs.forEach((line,k)=>{
    if(!hexPts&&k<segs.length){
      setLine(line,m2s(...segs[k].pa),m2s(...segs[k].pb));
      line.setAttribute('opacity','0.75');
    }else line.setAttribute('opacity','0');
  });

  // Y-point: intersection of inner plank boundaries
  let showYp=false;
  if(family==='ycovering'){
    const det=ct[0]*st[1]-ct[1]*st[0];
    if(Math.abs(det)>1e-10){
      const bnd0=lo[0],bnd1=hi[1];
      const[sx,sy]=m2s((bnd0*st[1]-bnd1*st[0])/det,(ct[0]*bnd1-ct[1]*bnd0)/det);
      ypointCircle.setAttribute('cx',sx);ypointCircle.setAttribute('cy',sy);
      ypointCircle.setAttribute('opacity','0.85');
      ypointLabel.setAttribute('x',sx+8);ypointLabel.setAttribute('y',sy-6);
      setText(ypointLabel,'Y-point');
      showYp=true;
    }
  }
  if(!showYp){
    ypointCircle.setAttribute('opacity','0');
    setText(ypointLabel,'');
  }

  // t-segments: uncovered edge runs (possibly several per edge)
  const edges=[[0,1],[1,2],[2,0]];
  let tsum=0;
  for(let e=0;e<3;e++){
    const[a,b]=edges[e];
    const[ax,ay]=vMath[a],[bx,by]=vMath[b];
    const edgeLen=Math.hypot(bx-ax,by-ay);
    const pt=t=>[(1-t)*ax+t*bx,(1-t)*ay+t*by];
    // Each plank covers an exact parameter interval of the edge
    // (proj is linear in t); runs = complement of their union.
    const iv=[];
    for(let i=0;i<3;i++){
      const p0=ct[i]*ax+st[i]*ay, p1=ct[i]*bx+st[i]*by, b_=p1-p0;
      if(Math.abs(b_)<1e-12){
        if(lo[i]-1e-8<=p0&&p0<=hi[i]+1e-8)iv.push([0,1]);
      }else{
        let u=(lo[i]-1e-8-p0)/b_, v=(hi[i]+1e-8-p0)/b_;
        if(u>v)[u,v]=[v,u];
        u=Math.max(0,u);v=Math.min(1,v);
        if(u<v)iv.push([u,v]);
      }
    }
    iv.sort((p,q)=>p[0]-q[0]);
    const runs=[];
    let cur=0;
    for(const[u,v]of iv){
      if(u>cur+1e-9)runs.push([cur,u]);
      if(v>cur)cur=v;
    }
    if(cur<1-1e-9)runs.push([cur,1]);
    tsum+=runs.reduce((acc,[u,v])=>acc+(v-u),0)*edgeLen;
    tSegPaths[e].setAttribute('d',runs.map(([u,v])=>{
      const[x1,y1]=m2s(...pt(u)),[x2,y2]=m2s(...pt(v));
      return`M${x1.toFixed(1)},${y1.toFixed(1)}L${x2.toFixed(1)},${y2.toFixed(1)}`;
    }).join(''));
    tSegPaths[e].setAttribute('opacity',runs.length?'0.8':'0');
    if(runs.length){
      const[u,v]=runs.reduce((m,r)=>r[1]-r[0]>m[1]-m[0]?r:m);
      const[lx,ly]=m2s(...pt((u+v)/2));
      const emx=(ax+bx)/2,emy=(ay+by)/2;
      const dx=emx-1/3,dy=emy-S3/6;
      const d=Math.hypot(dx,dy)||1;
      tSegLabels[e].setAttribute('x',lx+dx/d*14);
      tSegLabels[e].setAttribute('y',ly+dy/d*14+4);
      tSegLabels[e].setAttribute('opacity','1');
    }else tSegLabels[e].setAttribute('opacity','0');
  }
  setText(tsumEl,tsum.toFixed(3));
  tsumEl.className=tsum<1e-8?'ok':'bad';

  // Coverage status
  const status=hasGap?'<span class="bad">Gap present ✘</span>'
    : sum>1.005?'<span class="warn">Covers with slack</span>'
    : '<span class="ok">Tight covering ✔</span>';
  if(covEl.innerHTML!==status)covEl.innerHTML=status;
}

// ══════════════════════════════════════════════════════════════
//  UI bindings
// ══════════════════════════════════════════════════════════════

const deg1=v=>(v/10).toFixed(1)+'°';
const DISPLAYS=[
  [alphaSl,'alphav',v=>Math.round(v)+'°'],
  [bandSl,'bandTheta1v',deg1],
  [etSl[0],'etT1v',deg1],[etSl[1],'etT2v',deg1],[etSl[2],'etT3v',deg1],
  [ctT1Sl,'ctT1v',deg1],[ctT2Sl,'ctT2v',deg1],
  [hexA1Sl,'hexA1v',v=>(v/1000).toFixed(3)],
  [hexA2Sl,'hexA2v',v=>(v/1000).toFixed(3)],
  [hexDbSl,'hexDbv',v=>{const h=v/1000;return(h>=0?'+':'')+h.toFixed(3);}],
  [fthSl[0],'fth0v',v=>v.toFixed(1)+'°'],
  [fthSl[1],'fth1v',v=>v.toFixed(1)+'°'],
  [fthSl[2],'fth2v',v=>v.toFixed(1)+'°'],
  [fpSl[0],'fp0v',v=>(v/100).toFixed(2)],
  [fpSl[1],'fp1v',v=>(v/100).toFixed(2)],
  [fpSl[2],'fp2v',v=>(v/100).toFixed(2)],
];

function sync(){
  // sliders gray out where rw is determined rather than free;
  // 'indep' (free mode) opens all three with no sum constraint
  const mode=FAMILIES[family].rwMode;
  rw0Sl.disabled=mode==='fixed'||mode==='gauge';
  rw1Sl.disabled=mode!=='free'&&mode!=='indep';
  rw2Sl.disabled=mode!=='indep';
  for(const sl of[rw0Sl,rw1Sl,rw2Sl])sl.style.opacity=sl.disabled?'0.3':'1';
  rw0=rw0Sl.value/100;
  rw1=rw1Sl.value/100;
  if(mode!=='indep'){
    if(rw0+rw1>1){rw1=1-rw0;rw1Sl.value=rw1*100;}
    if(mode==='linked'){
      rw1=rw0;rw1Sl.value=rw0Sl.value;
      if(rw0>.5){rw0=.5;rw1=.5;rw0Sl.value=50;rw1Sl.value=50;}
    }
    if(mode==='fixed'){rw0=1/3;rw1=1/3;rw0Sl.value=33;rw1Sl.value=33;}
  }
  alpha=alphaSl.value*Math.PI/180;
  // sorted-angle clamps (coverage needs sorted theta)
  if(+etSl[1].value<+etSl[0].value)etSl[1].value=etSl[0].value;
  if(+etSl[2].value<+etSl[1].value)etSl[2].value=etSl[1].value;
  if(+ctT2Sl.value<+ctT1Sl.value)ctT2Sl.value=ctT1Sl.value;
  for(const[sl,out,fmt]of DISPLAYS)setText($(out),fmt(+sl.value));
  update();
}

function applyRows(){
  document.querySelectorAll('[data-for]').forEach(r=>
    r.hidden=!r.dataset.for.split(' ').includes(family));
}

// Grabbing a slider takes it over without stopping the drift: the
// animator skips user-held sliders; play (button/canvas) re-arms all.
const userHeld=new Set();
[rw0Sl,rw1Sl,rw2Sl,alphaSl,bandSl,...etSl,ctT1Sl,ctT2Sl,hexA1Sl,hexA2Sl,hexDbSl,...fthSl,...fpSl]
  .forEach(sl=>sl.addEventListener('input',e=>{if(e.isTrusted)userHeld.add(sl.id);sync();}));

document.querySelectorAll('.family-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.family-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    family=btn.dataset.family;
    const p=FAMILIES[family].preset;
    rw0Sl.value=p[0];rw1Sl.value=p[1];
    if(p.length>2)alphaSl.value=p[2];
    applyRows();
    sync();
    buildSliderCh();
  });
});

// ══════════════════════════════════════════════════════════════
//  Ambient drift: slow quasi-periodic motion through the active
//  family's parameters. Touching a slider holds that parameter;
//  the canvas or corner button toggles pause/play.
// ══════════════════════════════════════════════════════════════

const playBtn=$('playBtn');
let playing=false;
let tAnim=0,lastFrame=null;  // drift clock: advances only while playing
const PHI=(1+Math.sqrt(5))/2;
let sliderCh=[];
function buildSliderCh(){
  userHeld.clear();
  sliderCh=[...document.querySelectorAll('.controls input[type=range]')]
    .filter(sl=>!sl.disabled&&sl.id!=='hexDb'&&!(sl.closest('[data-for]')||{}).hidden)
    .map((sl,i)=>{
      // rw drift stays off the extremes so no plank degenerates
      const rwSl=sl===rw0Sl||sl===rw1Sl||sl===rw2Sl;
      // golden-spaced frequencies: pairwise ratios far from any
      // small-denominator rational, so the joint trajectory fills the
      // parameter box (equidistributed, Kronecker-Weyl) instead of
      // closing into a periodic Lissajous loop. Sector-bounded angle
      // channels sweep 1/3 the range of free-mode directions, so they
      // get a tempo boost to match visual speed.
      const boost={etT1:3,etT2:3,etT3:3,ctT1:3,ctT2:3,bandTheta1:4}[sl.id]||1;
      return{sl,lo:rwSl?8:+sl.min,hi:rwSl?55:+sl.max,
        om:.05*(1+(i*PHI)%1)*boost,ph:i*1.7};
    });
  rePhase();
}
// Re-anchor every channel's phase so its sinusoid passes through the
// slider's current value right now, keeping the direction of travel —
// resuming or switching families continues from the visible
// configuration instead of jumping to where the old curve would be.
function rePhase(){
  const t=tAnim;
  for(const ch of sliderCh){
    const v=+ch.sl.value;
    if(v<ch.lo)ch.lo=v;
    if(v>ch.hi)ch.hi=v;
    const u=ch.hi>ch.lo?2*(v-ch.lo)/(ch.hi-ch.lo)-1:0;
    const a=Math.asin(Math.max(-1,Math.min(1,u)));
    const oldPh=ch.om*t+ch.ph;
    ch.ph=(Math.cos(oldPh)>=0?a:Math.PI-a)-ch.om*t;
  }
}
function setPlaying(p){
  if(p===playing)return;
  playing=p;
  lastFrame=null;
  if(p){userHeld.clear();rePhase();}
  playBtn.textContent=p?'❚❚':'▶';
}
playBtn.addEventListener('click',()=>setPlaying(!playing));
svg.addEventListener('click',()=>setPlaying(!playing));
// Keep geometry and sliders on the same display frame. Even tiny
// parameter changes matter near contacts, so do not quantize them.
document.addEventListener('visibilitychange',()=>{lastFrame=null;});
function frame(now){
  if(playing&&!document.hidden&&lastFrame!=null){
    const dt=Math.min(100,now-lastFrame);  // cap: tab-suspend can't leap
    tAnim+=dt/1000;
    for(const ch of sliderCh)if(!userHeld.has(ch.sl.id)){
      ch.sl.value=ch.lo+(ch.hi-ch.lo)*(0.5+0.5*Math.sin(ch.om*tAnim+ch.ph));
    }
    sync();
  }
  lastFrame=document.hidden?null:now;
  requestAnimationFrame(frame);
}

// Theme toggle (init in <head> from localStorage / system preference)
const themeBtn=$('themeBtn');
function themeGlyph(){themeBtn.textContent=
  document.documentElement.getAttribute('data-theme')==='dark'?'☀':'☾';}
themeBtn.addEventListener('click',()=>{
  const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('tight-theme',t);
  themeGlyph();
});
themeGlyph();
applyRows();
sync();
buildSliderCh();
if(matchMedia('(prefers-reduced-motion: reduce)').matches)playBtn.textContent='▶';
else setPlaying(true);
requestAnimationFrame(frame);
</script>
</body>
</html>
